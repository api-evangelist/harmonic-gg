aid: harmonic-gg
name: Harmonic GG
description: >-
  Harmonic is a highly-configurable, open block-building system for Solana. Validators
  keep full autonomy over how their blocks are built, choosing their own block builder
  and scheduling strategy (FBA, FIFO, MREV, or custom) while the block engine streams
  the constructed block for broadcast. A Remote TPU aggregation layer collects proposals
  from independent builders in real time, HFT-router style, to raise validator revenue
  and strengthen network decentralization. Searchers submit atomic transaction bundles
  over a gRPC interface that is backwards-compatible with Jito's searcher protos, with
  revert protection, bundle privacy, and tips paid as ordinary priority fees (no protocol
  cut). Harmonic raised a $6M seed round led by Paradigm.
