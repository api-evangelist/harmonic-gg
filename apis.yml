apis:
- name: Harmonic Searcher API (gRPC)
  description: >-
    gRPC bundle-submission interface for searchers. Authenticate with a Solana keypair
    (challenge-response to Bearer tokens), then submit atomic transaction bundles with
    revert protection. Backwards-compatible with Jito's searcher protos; tips are
    priority fees with no protocol cut. Requires a whitelisted searcher pubkey.
  humanURL: https://docs.harmonic.gg/searchers/harmonic-bundles
  baseURL: https://fra.be.harmonic.gg
  tags:
  - Solana
  - MEV
  - Bundles
  - gRPC
  properties:
  - type: Protobuf
    url: grpc/harmonic-gg-searcher-searcher.proto
  - type: Protobuf
    url: grpc/harmonic-gg-searcher-auth.proto
  - type: Protobuf
    url: grpc/harmonic-gg-searcher-bundle.proto
  - type: Authentication
    url: authentication/harmonic-gg-authentication.yml
  - type: ErrorCatalog
    url: errors/harmonic-gg-error-codes.yml
- name: Harmonic Validator API (gRPC)
  description: >-
    gRPC services the Harmonic validator clients (Salsa/Samba) use to bind to a block
    builder: subscribe to packet and bundle streams, set the scheduling strategy,
    discover block engine endpoints, report leader windows, and proxy TPU traffic via
    the relayer.
  humanURL: https://docs.harmonic.gg/run-a-validator/endpoints
  baseURL: https://fra.auction.harmonic.gg
  tags:
  - Solana
  - Validator
  - Block Building
  - gRPC
